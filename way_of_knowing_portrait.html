<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Way of Knowing Portrait</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Courier+Prime&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  .container {
    position: relative;
    width: 700px;
    height: 700px;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    border-radius: 50%;
  }

  .labels {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .label {
    position: absolute;
    font-family: 'Courier Prime', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
  }

  .label-cognition {
    color: #ff9977;
    bottom: 28%;
    left: 50%;
    transform: translateX(-50%);
    animation-delay: 2s;
  }

  .label-knowing {
    color: #e8e060;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    animation-delay: 2.5s;
  }

  .label-un {
    color: #88aadd;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    animation-delay: 3s;
  }

  .label-awareness {
    color: #cccccc;
    top: 50%;
    right: -160px;
    transform: translateY(-50%);
    animation-delay: 3.5s;
    text-align: left;
    line-height: 1.8;
  }

  .title {
    position: absolute;
    top: -60px;
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(200,210,240,0.7);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 0.3em;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 0.5s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="title">Way of Knowing Portrait</div>
  <canvas id="c" width="700" height="700"></canvas>
  <div class="labels">
    <div class="label label-un">The "Un-" &nbsp;·&nbsp; unconscious</div>
    <div class="label label-cognition">Cognition</div>
    <div class="label label-knowing">Other Ways of Knowing</div>
    <div class="label label-awareness">
      Black Circle<br>= Awareness<br><br>
      <span style="font-size:9px; color:rgba(180,190,220,0.6); line-height:1.9; display:block; max-width:140px;">
        Within: all we<br>consciously hold.<br>Beyond: yet to be<br>integrated.
      </span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 700, H = 700;
const cx = W/2, cy = H/2;

// Stars
const stars = Array.from({length: 500}, () => ({
  x: Math.random()*W,
  y: Math.random()*H,
  r: Math.random()*1.2 + 0.2,
  a: Math.random(),
  speed: Math.random()*0.003 + 0.001
}));

let t = 0;

function drawBackground() {
  // Deep space gradient — blue/black watercolor feel
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, W*0.72);
  bg.addColorStop(0, '#0a0520');
  bg.addColorStop(0.3, '#060d1e');
  bg.addColorStop(0.6, '#030a14');
  bg.addColorStop(1, '#000005');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Painterly nebula washes
  const nebulaColors = [
    {x: cx-80, y: cy+60, r: 220, c0: 'rgba(20,40,100,0.18)', c1: 'rgba(10,20,60,0)'},
    {x: cx+100, y: cy-80, r: 180, c0: 'rgba(30,15,80,0.15)', c1: 'rgba(0,0,0,0)'},
    {x: cx-130, y: cy-100, r: 160, c0: 'rgba(10,50,90,0.12)', c1: 'rgba(0,0,0,0)'},
  ];
  nebulaColors.forEach(n => {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.c0);
    g.addColorStop(1, n.c1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });
}

function drawStars() {
  stars.forEach(s => {
    s.a += s.speed * Math.sin(t*0.01 + s.x);
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(s.a));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(200,210,255,${alpha * 0.6})`;
    ctx.fill();
  });
}

function drawYellowMist(pulse) {
  // Yellow mist — other ways of knowing, radiating outward
  for (let i = 5; i >= 0; i--) {
    const mistR = 90 + i * 28 + pulse * 4;
    const alpha = (0.06 - i*0.009) * (0.9 + 0.1 * Math.sin(t*0.02));
    const g = ctx.createRadialGradient(cx, cy, 40, cx, cy, mistR);
    g.addColorStop(0, `rgba(230,220,50,0)`);
    g.addColorStop(0.5, `rgba(220,200,40,${alpha})`);
    g.addColorStop(1, `rgba(180,150,20,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, mistR, 0, Math.PI*2);
    ctx.fill();
  }

  // Wispy tendrils
  for (let a = 0; a < Math.PI*2; a += 0.4) {
    const wobble = Math.sin(t*0.015 + a*3) * 12;
    const len = 115 + wobble + pulse*3;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    const tg = ctx.createLinearGradient(50, 0, len, 0);
    tg.addColorStop(0, 'rgba(240,220,30,0.06)');
    tg.addColorStop(1, 'rgba(200,170,10,0)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.ellipse(len*0.6, 0, len*0.45, 5+wobble*0.3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawRedOrb(pulse) {
  // Outer glow
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90);
  glow.addColorStop(0, 'rgba(200,60,30,0.4)');
  glow.addColorStop(0.4, 'rgba(180,40,20,0.15)');
  glow.addColorStop(1, 'rgba(150,20,10,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, 90, 0, Math.PI*2);
  ctx.fill();

  // Core orb
  const orbR = 52 + pulse * 1.5;
  const orb = ctx.createRadialGradient(cx - orbR*0.25, cy - orbR*0.2, orbR*0.05, cx, cy, orbR);
  orb.addColorStop(0, '#ffccaa');
  orb.addColorStop(0.15, '#ff7040');
  orb.addColorStop(0.5, '#cc2810');
  orb.addColorStop(0.85, '#8a1005');
  orb.addColorStop(1, '#3a0500');
  ctx.fillStyle = orb;
  ctx.beginPath();
  ctx.arc(cx, cy, orbR, 0, Math.PI*2);
  ctx.fill();

  // Surface shimmer
  const shimmer = ctx.createRadialGradient(cx - orbR*0.3, cy - orbR*0.3, 0, cx, cy, orbR);
  shimmer.addColorStop(0, 'rgba(255,200,160,0.35)');
  shimmer.addColorStop(0.4, 'rgba(255,100,50,0.1)');
  shimmer.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = shimmer;
  ctx.beginPath();
  ctx.arc(cx, cy, orbR, 0, Math.PI*2);
  ctx.fill();
}

function drawBlackRing(pulse) {
  const ringR = 165 + pulse * 1;
  const ringW = 10;

  // Faint halo outside ring
  const halo = ctx.createRadialGradient(cx, cy, ringR - 20, cx, cy, ringR + 30);
  halo.addColorStop(0, 'rgba(100,120,180,0)');
  halo.addColorStop(0.5, 'rgba(80,100,160,0.08)');
  halo.addColorStop(1, 'rgba(50,60,120,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR + 30, 0, Math.PI*2);
  ctx.fill();

  // Ring itself
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(5,5,10,0.95)';
  ctx.lineWidth = ringW + 2;
  ctx.stroke();

  // Ring edge glow
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(150,170,220,0.18)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, ringR + ringW/2 + 1, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(100,120,180,0.08)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function frame() {
  t++;
  ctx.clearRect(0, 0, W, H);

  // Clip to circle for watercolor edge
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, 348, 0, Math.PI*2);
  ctx.clip();

  const pulse = Math.sin(t * 0.018) * 3;

  drawBackground();
  drawStars();
  drawYellowMist(pulse);
  drawBlackRing(pulse);
  drawRedOrb(pulse);

  // Soft vignette
  const vig = ctx.createRadialGradient(cx, cy, 240, cx, cy, 350);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,5,0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
